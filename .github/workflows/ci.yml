name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  guard-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install pytest
        run: python -m pip install pytest
      - name: Run guard tests
        run: python -m pytest .vibe/plugins/polyglot-dev/tests/ -q
