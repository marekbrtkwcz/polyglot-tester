name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: python -m pip install pytest hypothesis jsonschema
      - name: Check README documents every skill
        run: python scripts/check_readme_skills.py
      - name: Run plugin tests (guard + structure)
        run: python -m pytest .vibe/plugins/polyglot-dev/tests/ tests/ -q

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install ruff
        run: python -m pip install ruff
      - name: Lint guard and tests
        run: python -m ruff check --isolated --select E4,E7,E9,F .vibe/plugins/polyglot-dev/

  plugin-schema:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install jsonschema
        run: python -m pip install jsonschema
      - name: Validate plugin.json against the official schema
        run: python scripts/validate_plugin_schema.py

  docs-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: markdownlint
        run: npx --yes markdownlint-cli2 "README.md" "CHANGELOG.md" ".vibe/plugins/polyglot-dev/**/*.md"
