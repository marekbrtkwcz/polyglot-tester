name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.11"
          - os: ubuntu-latest
            python-version: "3.12"
          - os: ubuntu-latest
            python-version: "3.13"
          - os: ubuntu-latest
            python-version: "3.14"
          # the plugin's primary audience runs Vibe on Windows
          - os: windows-latest
            python-version: "3.13"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Check README documents every skill
        run: python scripts/check_readme_skills.py
      - name: Run plugin tests (guard + structure) with coverage gate
        run: python -m pytest .vibe/plugins/polyglot-dev/tests/ tests/ -q --cov=.vibe/plugins/polyglot-dev --cov=scripts --cov-report=term-missing --cov-fail-under=75

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Lint plugin, scripts and root tests
        run: python -m ruff check --isolated --select E4,E7,E9,F .vibe/plugins/polyglot-dev/ scripts/ tests/
      - name: Check formatting
        run: python -m ruff format --check .vibe/plugins/polyglot-dev/ scripts/ tests/

  plugin-schema:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Validate plugin.json against the official schema
        run: python scripts/validate_plugin_schema.py

  docs-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: markdownlint
        run: npx --yes markdownlint-cli2@0.24.2 "README.md" "CHANGELOG.md" ".vibe/plugins/polyglot-dev/**/*.md"
