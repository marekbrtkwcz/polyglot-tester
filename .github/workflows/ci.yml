name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  guard-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: python -m pip install pytest hypothesis
      - name: Run guard tests
        run: python -m pytest .vibe/plugins/polyglot-dev/tests/ -q

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install ruff
        run: python -m pip install ruff
      - name: Lint guard and tests
        run: python -m ruff check --isolated --select E4,E7,E9,F .vibe/plugins/polyglot-dev/
