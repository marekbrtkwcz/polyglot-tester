name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run tests before packaging
        run: python -m pytest .vibe/plugins/polyglot-dev/tests/ tests/ -q
      - name: Check tag matches plugin.json version
        run: |
          set -eu
          VERSION=$(python -c "import json; print(json.load(open('.vibe/plugins/polyglot-dev/plugin.json'))['version'])")
          TAG="${GITHUB_REF_NAME#v}"
          if [ "$VERSION" != "$TAG" ]; then
            echo "::error::tag v$TAG does not match plugin.json version $VERSION"
            exit 1
          fi
      - name: Package plugin zip (tests excluded via export-ignore)
        run: |
          set -eu
          mkdir dist
          git archive --format=zip --prefix=polyglot-dev/ -o "dist/polyglot-dev-${GITHUB_REF_NAME#v}.zip" "HEAD:.vibe/plugins/polyglot-dev"
          python -c "import zipfile,sys; names=zipfile.ZipFile('dist/polyglot-dev-${GITHUB_REF_NAME#v}.zip').namelist(); print('\n'.join(names[:5])); print(f'... {len(names)} files'); assert not any('/tests/' in n for n in names), 'tests leaked into the zip'"
      - name: Attach zip to the release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
