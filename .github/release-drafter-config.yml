name-template: "v$RESOLVED_VERSION"
tag-template: "v$RESOLVED_VERSION"

categories:
  - title: "Features"
    labels: ["feature", "enhancement"]
  - title: "Bug fixes"
    labels: ["fix", "bug"]
  - title: "Security"
    labels: ["security"]
  - title: "Documentation"
    labels: ["docs"]
  - title: "Maintenance"
    labels: ["chore", "ci", "dependencies"]

change-template: "- $TITLE @$AUTHOR (#$NUMBER)"

version-resolver:
  major:
    labels: ["breaking"]
  minor:
    labels: ["feature", "enhancement"]
  patch:
    labels: ["fix", "bug", "security", "docs", "chore", "ci", "dependencies"]
